<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Drivers — AI Logistics Admin</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="/assets/css/style.css">
</head>

<body>

<div class="app-shell">

    <!-- Sidebar Backdrop -->
    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

    <!-- Sidebar -->
    <aside class="app-sidebar" id="appSidebar">

        <a href="admin-dashboard" class="navbar-brand mb-4 d-inline-flex">
            <span class="brand-mark">AL</span>
            AI Logistics
        </a>

        <div class="sidebar-section-label">Admin</div>

        <!-- Dashboard -->
        <a href="admin-dashboard" class="sidebar-link">
            <i class="bi bi-grid-1x2"></i>
            Dashboard
        </a>

        <!-- Drivers -->
        <a th:href="@{/admin/drivers}" class="sidebar-link active">
            <i class="bi bi-people"></i>
            Drivers
        </a>

        <div class="sidebar-section-label">Account</div>

        <!-- Logout -->
        <a th:href="@{/logout}" class="sidebar-link logout-link">
            <i class="bi bi-box-arrow-right"></i>
            Log out
        </a>

    </aside>


    <!-- Main Content -->
    <main class="app-main">

        <!-- Top Bar -->
        <div class="app-topbar">

            <div class="d-flex align-items-center gap-3">

                <button class="btn btn-sm btn-ghost-light d-lg-none"
                        id="sidebarToggle">

                    <i class="bi bi-list"></i>

                </button>

                <div class="fw-semibold">
                    Driver management
                </div>

            </div>

        </div>


        <!-- Page Content -->
        <div class="app-content">

            <!-- Filters -->
            <div class="d-flex flex-wrap gap-2 mb-3"
                 id="filterBar">

                <!-- All -->
                <a th:href="@{/admin/drivers}"
                   class="btn btn-sm btn-ghost-light active"
                   data-filter="all">

                    All

                </a>


                <!-- Pending -->
                <a th:href="@{/admin/drivers(status='Pending')}"
                   class="btn btn-sm btn-ghost-light"
                   data-filter="pending">

                    Pending

                </a>


                <!-- Activated -->
                <a th:href="@{/admin/drivers(status='Activated')}"
                   class="btn btn-sm btn-ghost-light"
                   data-filter="approved">

                    Approved

                </a>


                <!-- Rejected -->
                <a th:href="@{/admin/drivers(status='Rejected')}"
                   class="btn btn-sm btn-ghost-light"
                   data-filter="rejected">

                    Rejected

                </a>

            </div>


            <!-- Driver Table -->
            <div class="panel">

                <div class="table-responsive">

                    <table class="table table-manifest align-middle mb-0">

                        <!-- Table Header -->
                        <thead>

                        <tr>

                            <th>Driver</th>

                            <th>Contact</th>

                            <th>Vehicle</th>

                            <th>License</th>

                            <th>Status</th>

                            <th class="text-end">
                                Actions
                            </th>

                        </tr>

                        </thead>


                        <!-- Table Body -->
                        <tbody id="driverRows">

                        <!-- Loop through drivers -->
                        <tr th:each="driver : ${drivers}">

                            <!-- Driver Name -->
                            <td th:text="${driver.name}">
                            </td>


                            <!-- Phone -->
                            <td th:text="${driver.phone}">
                            </td>


                            <!-- Vehicle -->
                            <td th:text="${driver.vehicle_type}">
                            </td>


                            <!-- License -->
                            <td>
                                Available
                            </td>


                            <!-- Status -->
                            <td th:text="${driver.status}">
                            </td>


                            <!-- Actions -->
                            <td class="text-end">

                                <!-- View Driver -->
                                <form th:action="@{/admin/DriverDetails}"
                                      method="post"
                                      class="d-inline">

                                    <input type="hidden"
                                           name="email"
                                           th:value="${driver.email}">

                                    <!-- CSRF -->
                                    <input type="hidden"
                                           th:name="${_csrf.parameterName}"
                                           th:value="${_csrf.token}">

                                    <button type="submit"
                                            class="btn btn-primary">

                                        View Driver

                                    </button>

                                </form>


                                <!-- Activate -->
                                <a class="btn btn-success"
                                   th:href="@{/admin/DriverStatus(status='Activated', email=${driver.email})}">

                                    Activate

                                </a>


                                <!-- Deactivate -->
                                <a class="btn btn-danger"
                                   th:href="@{/admin/DriverStatus(status='Deactivated', email=${driver.email})}">

                                    Deactivate

                                </a>


                                <!-- Reject -->
                                <a class="btn btn-danger"
                                   th:href="@{/admin/DriverStatus(status='Rejected', email=${driver.email})}">

                                    Reject

                                </a>

                            </td>

                        </tr>

                        </tbody>

                    </table>

                </div>


                <!-- Empty State -->
                <div id="emptyState"
                     class="empty-state d-none">

                    <i class="bi bi-people"></i>

                    No drivers in this filter.

                </div>

            </div>

        </div>

    </main>

</div>


<!-- ===================================================== -->
<!-- DELETE MODAL -->
<!-- ===================================================== -->

<div class="modal fade"
     id="deleteModal"
     tabindex="-1"
     aria-hidden="true">

    <div class="modal-dialog modal-dialog-centered">

        <div class="modal-content">

            <div class="modal-header">

                <h5 class="modal-title">
                    Delete Driver
                </h5>

                <button type="button"
                        class="btn-close"
                        data-bs-dismiss="modal">
                </button>

            </div>


            <div class="modal-body">

                Are you sure you want to delete this driver?

            </div>


            <div class="modal-footer">

                <button type="button"
                        class="btn btn-secondary"
                        data-bs-dismiss="modal">

                    Cancel

                </button>

                <button type="button"
                        class="btn btn-danger"
                        id="confirmDeleteBtn">

                    Delete

                </button>

            </div>

        </div>

    </div>

</div>


<!-- ===================================================== -->
<!-- VIEW DRIVER MODAL -->
<!-- ===================================================== -->

<div class="modal fade"
     id="viewModal"
     tabindex="-1"
     aria-hidden="true">

    <div class="modal-dialog modal-lg modal-dialog-centered">

        <div class="modal-content">

            <div class="modal-header">

                <h5 class="modal-title">
                    Driver Details
                </h5>

                <button type="button"
                        class="btn-close"
                        data-bs-dismiss="modal">
                </button>

            </div>


            <div class="modal-body"
                 id="viewDriverContent">

                <!-- Driver details can be loaded here -->

            </div>

        </div>

    </div>

</div>


<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>


<!-- Custom JS -->
<script src="/assets/js/store.js"></script>

<script src="/assets/js/ai.js"></script>

</body>

</html>
