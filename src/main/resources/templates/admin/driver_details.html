<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Drivers — ShippSure Admin</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet"
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet"
	href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" th:href="@{/assets/css/style.css}">
</head>
<body>
	<div class="app-shell">
		<div class="sidebar-backdrop" id="sidebarBackdrop"></div>
		<aside class="app-sidebar" id="appSidebar">
			<a th:href="@{/}" class="navbar-brand mb-4 d-inline-flex"><span
				class="brand-mark">SS</span>ShippSure</a>
			<div class="sidebar-section-label">Admin</div>
			<a th:href="@{/admin/admin-dashboard}" class="sidebar-link"><i
				class="bi bi-grid-1x2"></i>Dashboard</a> <a href="drivers"
				class="sidebar-link"><i class="bi bi-people"></i>Drivers</a>
			<div class="sidebar-section-label">Account</div>
			<a th:href="@{/logout}" class="sidebar-link logout-link"><i
				class="bi bi-box-arrow-right"></i>Log out</a>
		</aside>

		<main class="app-main">
			<div class="app-topbar">
				<div class="d-flex align-items-center gap-3">
					<button class="btn btn-sm btn-ghost-light d-lg-none"
						id="sidebarToggle">
						<i class="bi bi-list"></i>
					</button>
					<div class="fw-semibold">Driver Details</div>
				</div>
			</div>

			<div class="app-content">
				<div class="panel">
					<p>
						Name: <span th:text='${driver.name}'></span>
					</p>
					<p>
						Email: <span th:text='${driver.email}'></span>
					</p>
					<p>
						Phone: <span th:text='${driver.phone}'></span>
					</p>
					<p>
						Vehicle Type: <span th:text='${driver.vehicle_type}'></span>
					</p>
					<p>
						Vehicle RC: <span th:text='${driver.vehicle_rc_no}'></span>
					</p>
					<img th:src='@{/driver/DriverRC(email=${driver.email})}'
						height='200px' class="mb-3 rounded border">
					<p>
						License No: <span th:text='${driver.driving_license_no}'></span>
					</p>
					<img th:src='@{/driver/DriverLicense(email=${driver.email})}'
						height='200px' class="mb-3 rounded border">
					<p>
						Status: <span th:text='${driver.status}' class="badge bg-info"></span>
					</p>
					<div class="mt-3">
						<a
							th:href="@{/admin/DriverStatus(status='Activated', email=${driver.email})}"
							class="btn btn-sm btn-success me-2">Approve</a> <a
							th:href="@{/admin/DriverStatus(status='Rejected', email=${driver.email})}"
							class="btn btn-sm btn-danger">Reject</a>
					</div>
				</div>
			</div>
		</main>
	</div>

	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
