<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Driver Dashboard — AI Logistics</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
<div class="app-shell">
  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
  <aside class="app-sidebar" id="appSidebar">
    <a href="./index.html" class="navbar-brand mb-4 d-inline-flex"><span class="brand-mark">AL</span>AI Logistics</a>
    <div class="sidebar-section-label">Driver</div>
    <a href="./dashboard.html" class="sidebar-link active"><i class="bi bi-grid-1x2"></i>My Deliveries</a>
    <div class="sidebar-section-label">Account</div>
    <a th:href="@{/logout}" class="sidebar-link logout-link"><i class="bi bi-box-arrow-right"></i>Log out</a>
            <div class="sidebar-section-label">Duty Status [<small th:text="${session.driver != null ? session.driver.rideStatus : 'OFF'}"></small>]</div>
    <a th:href="@{/driver/SetRideStatus}" class="sidebar-link" th:if="${session.driver != null}">
        <i class="bi bi-power me-1"></i>
        <span th:if="${session.driver.rideStatus=='Busy'}">Go ON Duty (Free)</span>
        <span th:if="${session.driver.rideStatus=='Free'}">Go OFF Duty (Busy)</span>
    </a>
    </a>
  </aside>

  <main class="app-main">
    <div class="app-topbar">
      <div class="d-flex align-items-center gap-3">
        <button class="btn btn-sm btn-ghost-light d-lg-none" id="sidebarToggle"><i class="bi bi-list"></i></button>
        <div>
          <div class="fw-semibold user-name-slot">—</div>
          <div class="small text-muted-light">Driver account</div>
        </div>
      </div>
      <div class="avatar-chip user-chip-slot">—</div>
    </div>

    <div class="app-content">
      <h3 class="mb-1">Your delivery queue</h3>
      <p class="text-muted-light mb-4">Assigned shipments ready for pickup and delivery.</p>

      <div class="row g-3" id="statCards"></div>

      <div class="row g-3 mt-2" id="shipmentCards"></div>
      <div id="emptyState" class="empty-state d-none"><i class="bi bi-inbox"></i>No shipments assigned to you yet.</div>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/assets/js/store.js"></script>
</body>
</html>
